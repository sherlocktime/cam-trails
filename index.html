<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Re-Trazado GPU</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #000; color: #fff; user-select: none; touch-action: manipulation; }
        input[type=range] { -webkit-appearance: none; background: rgba(255, 255, 255, 0.2); height: 4px; border-radius: 2px; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%;
            background: #f59e0b; cursor: pointer; box-shadow: 0 0 10px rgba(245, 158, 11, 0.6);
        }
    </style>
</head>
<body class="h-[100dvh] w-screen flex flex-col overflow-hidden relative m-0 p-0">

    <main class="absolute inset-0 w-full h-full bg-neutral-950 flex items-center justify-center overflow-hidden z-0">
        <video id="video" autoplay playsinline muted class="hidden"></video>
        <canvas id="glCanvas" class="w-full h-full object-cover"></canvas>
    </main>

    <header class="absolute top-0 left-0 right-0 px-4 pt-3 pb-2 flex justify-between items-center z-20">
        <div class="bg-black/50 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/10 text-xs font-mono tracking-wide flex items-center space-x-2 shadow-lg">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse" id="statusDot"></span>
            <span id="statusText" class="font-semibold text-neutral-200">VIVO (GPU)</span>
        </div>

        <div class="flex items-center space-x-2">
            <button id="btnShaderMode" class="w-36 bg-black/50 backdrop-blur-md border border-white/10 px-3 py-1.5 rounded-full text-xs font-mono font-semibold shadow-lg active:scale-95 transition">
                <span id="shaderLabel" class="text-amber-400 font-bold">1 ESTELAS LUZ</span>
            </button>
            <button id="btnSwitchCamera" class="w-9 h-9 rounded-full bg-black/50 backdrop-blur-md border border-white/10 flex items-center justify-center text-white active:scale-95 transition shadow-lg">
                <i class="fa-solid fa-camera-rotate text-xs"></i>
            </button>
        </div>
    </header>

    <footer class="absolute bottom-0 left-0 right-0 px-4 pb-4 pt-2 z-20 flex flex-col landscape:flex-row landscape:justify-between landscape:items-end space-y-3 landscape:space-y-0">
        <div class="flex flex-col space-y-2 w-full landscape:w-72 bg-black/50 backdrop-blur-md px-3.5 py-2.5 rounded-xl border border-white/10 shadow-xl">
            <div class="flex flex-col space-y-0.5">
                <div class="flex justify-between text-[11px] text-neutral-300 font-medium">
                    <span>Desvanecimiento (Decay)</span>
                    <span id="decayVal" class="text-amber-400 font-bold font-mono">0.99</span>
                </div>
                <input type="range" id="decaySlider" min="90" max="100" value="99" class="w-full">
            </div>
        </div>

        <div class="flex items-center justify-between landscape:justify-end landscape:space-x-4 px-2">
            <button id="btnReset" class="w-12 h-12 rounded-full bg-neutral-900/80 backdrop-blur-md border border-white/10 flex items-center justify-center text-red-500 active:scale-95 transition shadow-lg" title="Limpiar acumulación">
                <i class="fa-solid fa-rotate-right text-lg"></i>
            </button>
            <button id="btnCapture" class="relative w-20 h-20 rounded-full border-4 border-white/90 bg-black/20 backdrop-blur-sm flex items-center justify-center p-1 shadow-2xl active:scale-95 transition">
                <div class="w-full h-full bg-amber-500 rounded-full flex items-center justify-center shadow-inner">
                    <i class="fa-solid fa-camera text-white text-xl"></i>
                </div>
            </button>
        </div>
    </footer>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('glCanvas');
        const gl = canvas.getContext('webgl', { preserveDrawingBuffer: true });

        let currentFacingMode = 'environment';
        let currentStream = null;
        let shaderProgram = null;
        let activeShaderIndex = 0;
        let decayValue = 0.99;

        // Vertex Shader Standard
        const vsSource = `
            attribute vec2 a_position;
            varying vec2 v_texCoord;
            void main() {
                v_texCoord = vec2((a_position.x + 1.0) / 2.0, 1.0 - (a_position.y + 1.0) / 2.0);
                gl_Position = vec4(a_position, 0.0, 1.0);
            }
        `;

        // Shader 1: Light Trails
        const fsLight = `
            precision mediump float;
            uniform sampler2D u_currentFrame;
            uniform sampler2D u_accumulatedFrame;
            uniform float u_decay;
            varying vec2 v_texCoord;
            void main() {
                vec4 current = texture2D(u_currentFrame, v_texCoord);
                vec4 accum = texture2D(u_accumulatedFrame, v_texCoord) * u_decay;
                float lumaC = dot(current.rgb, vec3(0.299, 0.587, 0.114));
                float lumaA = dot(accum.rgb, vec3(0.299, 0.587, 0.114));
                gl_FragColor = (lumaC > lumaA) ? current : accum;
            }
        `;

        // Shader 2: Motion Trails
        const fsMotion = `
            precision mediump float;
            uniform sampler2D u_currentFrame;
            uniform sampler2D u_accumulatedFrame;
            uniform float u_decay;
            varying vec2 v_texCoord;
            void main() {
                vec4 current = texture2D(u_currentFrame, v_texCoord);
                vec4 accum = texture2D(u_accumulatedFrame, v_texCoord);
                vec3 diff = abs(current.rgb - accum.rgb);
                float motion = dot(diff, vec3(0.333));
                if (motion > 0.15) {
                    gl_FragColor = vec4(diff * 2.5 + current.rgb * 0.4, 1.0);
                } else {
                    gl_FragColor = mix(accum * u_decay, current, 0.05);
                }
            }
        `;

        // Shader 3: Shadow Trails
        const fsShadow = `
            precision mediump float;
            uniform sampler2D u_currentFrame;
            uniform sampler2D u_accumulatedFrame;
            uniform float u_decay;
            varying vec2 v_texCoord;
            void main() {
                vec4 current = texture2D(u_currentFrame, v_texCoord);
                vec4 accum = texture2D(u_accumulatedFrame, v_texCoord);
                float lumaC = dot(current.rgb, vec3(0.299, 0.587, 0.114));
                float lumaA = dot(accum.rgb, vec3(0.299, 0.587, 0.114));
                gl_FragColor = (lumaC < lumaA) ? current : accum;
            }
        `;

        const shaders = [
            { name: '1 ESTELAS LUZ', fs: fsLight, class: 'text-amber-400 font-bold' },
            { name: '2 MOVIMIENTO', fs: fsMotion, class: 'text-emerald-400 font-bold' },
            { name: '3 SOMBRAS', fs: fsShadow, class: 'text-rose-400 font-bold' }
        ];

        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            return shader;
        }

        function initProgram(fsSource) {
            const vs = createShader(gl, gl.VERTEX_SHADER, vsSource);
            const fs = createShader(gl, gl.FRAGMENT_SHADER, fsSource);
            const prog = gl.createProgram();
            gl.attachShader(prog, vs);
            gl.attachShader(prog, fs);
            gl.linkProgram(prog);
            return prog;
        }

        // Configuración de Framebuffers Ping-Pong
        let textures = [], framebuffers = [];
        let count = 0;

        function initFramebuffers(w, h) {
            textures = []; framebuffers = [];
            for (let i = 0; i < 2; i++) {
                const tex = gl.createTexture();
                gl.bindTexture(gl.TEXTURE_2D, tex);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

                const fb = gl.createFramebuffer();
                gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
                gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);

                textures.push(tex);
                framebuffers.push(fb);
            }
            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        }

        let videoTexture = null;
        function initVideoTexture() {
            videoTexture = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, videoTexture);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        }

        async function initCamera() {
            if (currentStream) currentStream.getTracks().forEach(t => t.stop());
            currentStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { ideal: currentFacingMode }, width: { ideal: 1280 }, height: { ideal: 720 } }
            });
            video.srcObject = currentStream;
            await video.play();

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            gl.viewport(0, 0, canvas.width, canvas.height);

            initFramebuffers(canvas.width, canvas.height);
            initVideoTexture();
            shaderProgram = initProgram(shaders[activeShaderIndex].fs);
            
            // Quad buffer setup
            const positionBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

            render();
        }

        function render() {
            if (!video.paused && video.readyState >= 2) {
                gl.bindTexture(gl.TEXTURE_2D, videoTexture);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);

                const readIdx = count % 2;
                const writeIdx = (count + 1) % 2;

                gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffers[writeIdx]);
                gl.useProgram(shaderProgram);

                const posLoc = gl.getAttribLocation(shaderProgram, "a_position");
                gl.enableVertexAttribArray(posLoc);
                gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

                gl.activeTexture(gl.TEXTURE0);
                gl.bindTexture(gl.TEXTURE_2D, videoTexture);
                gl.uniform1i(gl.getUniformLocation(shaderProgram, "u_currentFrame"), 0);

                gl.activeTexture(gl.TEXTURE1);
                gl.bindTexture(gl.TEXTURE_2D, textures[readIdx]);
                gl.uniform1i(gl.getUniformLocation(shaderProgram, "u_accumulatedFrame"), 1);

                gl.uniform1f(gl.getUniformLocation(shaderProgram, "u_decay"), decayValue);

                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

                // Render en pantalla principal
                gl.bindFramebuffer(gl.FRAMEBUFFER, null);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

                count++;
            }
            requestAnimationFrame(render);
        }

        // Eventos UI
        document.getElementById('btnShaderMode').addEventListener('click', () => {
            activeShaderIndex = (activeShaderIndex + 1) % shaders.length;
            const s = shaders[activeShaderIndex];
            document.getElementById('shaderLabel').textContent = s.name;
            document.getElementById('shaderLabel').className = s.class;
            shaderProgram = initProgram(s.fs);
        });

        document.getElementById('decaySlider').addEventListener('input', (e) => {
            decayValue = parseFloat(e.target.value) / 100;
            document.getElementById('decayVal').textContent = decayValue.toFixed(2);
        });

        document.getElementById('btnReset').addEventListener('click', () => {
            initFramebuffers(canvas.width, canvas.height);
        });

        document.getElementById('btnSwitchCamera').addEventListener('click', () => {
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            initCamera();
        });

        document.getElementById('btnCapture').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `captura_shader_${Date.now()}.jpg`;
            link.href = canvas.toDataURL('image/jpeg', 0.95);
            link.click();
        });

        window.addEventListener('load', initCamera);
    </script>
</body>
</html>
