<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LightTrails Pro - Larga Exposición Móvil</title>
    <!-- Tailwind CSS for modern responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        /* Custom smooth range slider styling */
        input[type=range] {
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.2);
            height: 6px;
            border-radius: 3px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 22px;
            width: 22px;
            border-radius: 50%;
            background: #f59e0b;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden justify-between">

    <header class="flex justify-between items-center px-6 py-4 bg-black/40 backdrop-blur-md z-20 border-b border-white/10">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-camera-rotate text-amber-400 text-xl"></i>
            <span class="font-bold tracking-wider text-sm">LightTrails <span class="text-amber-400">PRO</span></span>
        </div>
        <div class="flex items-center space-x-3">
            <button id="btnSwitchCamera" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center active:scale-95 transition">
                <i class="fa-solid fa-sync text-sm"></i>
            </button>
        </div>
    </header>

    <main class="relative flex-1 w-full bg-neutral-950 overflow-hidden flex items-center justify-center">
        <!-- Hidden video stream element -->
        <video id="video" autoplay playsinline muted class="hidden"></video>
        
        <!-- Interactive Canvas Viewport -->
        <canvas id="canvas" class="w-full h-full object-cover"></canvas>

        <!-- Live Status Badge / Overlays -->
        <div id="statusBadge" class="absolute top-4 left-4 bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/10 text-xs font-mono tracking-wide flex items-center space-x-2 z-10">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse" id="statusDot"></span>
            <span id="statusText">LISTO PARA CAPTURAR</span>
        </div>

        <!-- Progress bar during multi-frame stacking -->
        <div id="progressContainer" class="absolute bottom-4 left-6 right-6 hidden z-10">
            <div class="flex justify-between text-xs font-mono mb-1 text-amber-400">
                <span id="progressLabel">Procesando exposición...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="w-full bg-white/20 h-2 rounded-full overflow-hidden">
                <div id="progressBar" class="bg-amber-500 h-full w-0 transition-all duration-75"></div>
            </div>
        </div>
    </main>

    <footer class="bg-black/80 backdrop-blur-lg px-6 py-6 border-t border-white/10 z-20 flex flex-col space-y-4">
        
        <!-- Controls: Frame Slider configuration -->
        <div id="configPanel" class="flex flex-col space-y-2">
            <div class="flex justify-between text-xs text-neutral-400 font-medium px-1">
                <span>Número de Frames a Acumular</span>
                <span id="frameCountValue" class="text-amber-400 font-bold font-mono">10 frames</span>
            </div>
            <input type="range" id="frameSlider" min="2" max="60" value="10" class="w-full">
        </div>

        <!-- Main Action Buttons Row -->
        <div class="flex items-center justify-around px-4">
            <!-- Reset Button -->
            <button id="btnReset" class="w-12 h-12 rounded-full bg-neutral-800 flex items-center justify-center text-neutral-300 hover:bg-neutral-700 active:scale-95 transition shadow-lg">
                <i class="fa-solid fa-rotate-left text-lg"></i>
            </button>

            <!-- Shutter Button (Big Round Capture Button) -->
            <button id="btnCapture" class="relative w-20 h-20 rounded-full border-4 border-white flex items-center justify-center p-1 shadow-2xl active:scale-95 transition">
                <div id="shutterInner" class="w-full h-full bg-amber-500 rounded-full transition-all duration-200 flex items-center justify-center shadow-inner">
                    <i class="fa-solid fa-bolt text-white text-2xl"></i>
                </div>
            </button>

            <!-- Download Button -->
            <button id="btnDownload" disabled class="w-12 h-12 rounded-full bg-neutral-800 flex items-center justify-center text-neutral-500 hover:bg-neutral-700 active:scale-95 transition shadow-lg opacity-50 cursor-not-allowed">
                <i class="fa-solid fa-download text-lg"></i>
            </button>
        </div>
    </footer>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        const frameSlider = document.getElementById('frameSlider');
        const frameCountValue = document.getElementById('frameCountValue');
        const btnCapture = document.getElementById('btnCapture');
        const shutterInner = document.getElementById('shutterInner');
        const btnReset = document.getElementById('btnReset');
        const btnDownload = document.getElementById('btnDownload');
        const btnSwitchCamera = document.getElementById('btnSwitchCamera');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const statusBadge = document.getElementById('statusBadge');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');
        const progressLabel = document.getElementById('progressLabel');
        const configPanel = document.getElementById('configPanel');

        let currentFacingMode = 'environment'; // Empezar con cámara trasera
        let currentStream = null;
        let isCapturing = false;
        let previewAnimationId = null;

        // Actualizar etiqueta del slider
        frameSlider.addEventListener('input', (e) => {
            frameCountValue.textContent = `${e.target.value} frames`;
        });

        // Inicializar o cambiar flujo de cámara con getUserMedia
        async function initCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            try {
                const constraints = {
                    video: {
                        facingMode: { ideal: currentFacingMode },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                };

                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;

                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        resolve();
                    };
                });

                // Ajustar resolución del canvas según dimensiones del video de la cámara
                canvas.width = video.videoWidth || 1280;
                canvas.height = video.videoHeight || 720;

                // Iniciar loop de previsualización en vivo
                startPreviewLoop();

            } catch (err) {
                console.error("Error al acceder a la cámara:", err);
                statusText.textContent = "ERROR DE CÁMARA (Permisos / HTTPS)";
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-red-500";
            }
        }

        // Loop para mostrar video en tiempo real antes de capturar
        function startPreviewLoop() {
            if (isCapturing) return;

            function drawPreview() {
                if (isCapturing) return;
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1.0;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                previewAnimationId = requestAnimationFrame(drawPreview);
            }
            drawPreview();
        }

        // Cambiar entre cámara frontal y trasera
        btnSwitchCamera.addEventListener('click', () => {
            if (isCapturing) return;
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            initCamera();
        });

        // Botón de captura / obturador
        btnCapture.addEventListener('click', async () => {
            if (isCapturing) return;
            
            // Cancelar loop de previsualización
            if (previewAnimationId) {
                cancelAnimationFrame(previewAnimationId);
            }

            isCapturing = true;
            configPanel.style.opacity = '0.4';
            configPanel.style.pointerEvents = 'none';
            btnSwitchCamera.style.opacity = '0.4';
            btnSwitchCamera.style.pointerEvents = 'none';
            btnDownload.disabled = true;
            btnDownload.classList.add('opacity-50', 'cursor-not-allowed');

            const targetFrames = parseInt(frameSlider.value);
            let capturedCount = 0;

            // Preparar lienzo base negro para iniciar acumulación limpia
            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 1.0;
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            statusText.textContent = `EXPONIENDO (0/${targetFrames})`;
            statusDot.className = "w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse";
            progressContainer.classList.remove('hidden');
            shutterInner.className = "w-full h-full bg-red-600 rounded-full animate-ping";

            // Intervalo o bucle controlado para capturar N frames consecutivos
            const captureInterval = setInterval(() => {
                capturedCount++;

                // Aplicar mezcla aditiva de luces ('lighter') para acumular estelas lumínicas
                ctx.globalCompositeOperation = 'lighter';
                ctx.globalAlpha = 0.9; // Ligero factor de decaimiento para evitar saturación total en blanco
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Actualizar barra de progreso
                const percent = Math.round((capturedCount / targetFrames) * 100);
                progressBar.style.width = `${percent}%`;
                progressPercent.textContent = `${percent}%`;
                statusText.textContent = `EXPONIENDO (${capturedCount}/${targetFrames})`;

                if (capturedCount >= targetFrames) {
                    clearInterval(captureInterval);
                    finalizarCaptura();
                }
            }, 100); // Frecuencia de muestreo de frames (aprox 10 fps de captura para larga exposición limpia)
        });

        function finalizarCaptura() {
            isCapturing = false;
            shutterInner.className = "w-full h-full bg-amber-500 rounded-full flex items-center justify-center shadow-inner";
            progressContainer.classList.add('hidden');
            
            statusText.textContent = "EXPOSICIÓN FINALIZADA";
            statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500";

            // Habilitar controles y botón de descarga
            configPanel.style.opacity = '1';
            configPanel.style.pointerEvents = 'auto';
            btnSwitchCamera.style.opacity = '1';
            btnSwitchCamera.style.pointerEvents = 'auto';

            btnDownload.disabled = false;
            btnDownload.classList.remove('opacity-50', 'cursor-not-allowed');
            btnDownload.classList.add('text-white', 'bg-amber-600', 'hover:bg-amber-500');
        }

        // Botón de Reiniciar
        btnReset.addEventListener('click', () => {
            if (isCapturing) return;
            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 1.0;
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            statusText.textContent = "LISTO PARA CAPTURAR";
            statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500";
            btnDownload.disabled = true;
            btnDownload.classList.add('opacity-50', 'cursor-not-allowed');
            btnDownload.classList.remove('text-white', 'bg-amber-600', 'hover:bg-amber-500');
            
            startPreviewLoop();
        });

        // Botón de Descarga de Imagen
        btnDownload.addEventListener('click', () => {
            if (isCapturing || btnDownload.disabled) return;
            
            const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
            const link = document.createElement('a');
            link.download = `LightTrail_${Date.now()}.jpg`;
            link.href = dataUrl;
            link.click();
        });

        // Iniciar aplicación al cargar la ventana
        window.addEventListener('load', () => {
            initCamera();
        });
    </script>
</body>
</html>
