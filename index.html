<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LightTrails Pro - Larga Exposición</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #000;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        /* Custom styling for range inputs */
        input[type=range] {
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.25);
            height: 4px;
            border-radius: 2px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #f59e0b;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.6);
        }
    </style>
</head>
<body class="h-[100dvh] w-screen flex flex-col overflow-hidden relative m-0 p-0">

    <main class="absolute inset-0 w-full h-full bg-neutral-950 flex items-center justify-center overflow-hidden z-0">
        <video id="video" autoplay playsinline muted class="hidden"></video>
        <canvas id="canvas" class="w-full h-full object-cover"></canvas>
    </main>

    <header class="absolute top-0 left-0 right-0 px-4 pt-3 pb-2 flex justify-between items-center z-20 pointer-events-auto">
        <div class="bg-black/50 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/10 text-xs font-mono tracking-wide flex items-center space-x-2 shadow-lg">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse" id="statusDot"></span>
            <span id="statusText" class="font-semibold text-neutral-200">VIVO</span>
        </div>
        
        <div class="flex items-center space-x-2">
            <!-- Blend Mode Switcher -->
            <button id="btnBlendMode" class="bg-black/50 backdrop-blur-md border border-white/10 px-3 py-1.5 rounded-full text-xs font-mono text-amber-400 font-semibold shadow-lg active:scale-95 transition">
                MODO: <span id="blendModeLabel">Lighter</span>
            </button>
            <!-- Fullscreen Button -->
            <button id="btnFullscreen" class="w-9 h-9 rounded-full bg-black/50 backdrop-blur-md border border-white/10 flex items-center justify-center text-white active:scale-95 transition shadow-lg" title="Pantalla Completa">
                <i class="fa-solid fa-expand text-xs"></i>
            </button>
            <!-- Switch Camera Button -->
            <button id="btnSwitchCamera" class="w-9 h-9 rounded-full bg-black/50 backdrop-blur-md border border-white/10 flex items-center justify-center text-white active:scale-95 transition shadow-lg" title="Cambiar Cámara">
                <i class="fa-solid fa-camera-rotate text-xs"></i>
            </button>
        </div>
    </header>

    <footer class="absolute bottom-0 left-0 right-0 px-4 pb-6 pt-3 bg-gradient-to-t from-black/90 via-black/50 to-transparent backdrop-blur-[2px] z-20 flex flex-col space-y-3">
        
        <!-- Progress bar during multi-frame stacking -->
        <div id="progressContainer" class="hidden flex flex-col space-y-1 w-full bg-black/60 backdrop-blur-md p-2.5 rounded-xl border border-white/10">
            <div class="flex justify-between text-[11px] font-mono text-amber-400">
                <span id="progressLabel">Apilando frames...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="w-full bg-white/20 h-1.5 rounded-full overflow-hidden">
                <div id="progressBar" class="bg-amber-500 h-full w-0 transition-all duration-75"></div>
            </div>
        </div>

        <!-- Config Panel (Frames, Opacity & Resolution) -->
        <div id="configPanel" class="flex flex-col space-y-2 bg-black/50 backdrop-blur-md px-3.5 py-2.5 rounded-xl border border-white/10 shadow-xl">
            <!-- Frames Slider -->
            <div class="flex flex-col space-y-0.5">
                <div class="flex justify-between text-[11px] text-neutral-300 font-medium">
                    <span>Frames a acumular</span>
                    <span id="frameCountValue" class="text-amber-400 font-bold font-mono">15 frames</span>
                </div>
                <input type="range" id="frameSlider" min="5" max="30" value="15" class="w-full">
            </div>

            <!-- Opacity Slider -->
            <div class="flex flex-col space-y-0.5">
                <div class="flex justify-between text-[11px] text-neutral-300 font-medium">
                    <span>Opacidad por frame</span>
                    <span id="opacityValue" class="text-amber-400 font-bold font-mono">80%</span>
                </div>
                <input type="range" id="opacitySlider" min="5" max="100" value="80" class="w-full">
            </div>

            <!-- Resolution Selector Buttons -->
            <div class="flex items-center justify-between pt-1 border-t border-white/10">
                <span class="text-[11px] text-neutral-400 font-medium">Resolución:</span>
                <div class="flex space-x-1.5">
                    <button id="btnRes720" class="px-2.5 py-0.5 rounded text-[10px] font-mono font-bold bg-amber-500 text-black transition">720p</button>
                    <button id="btnRes1080" class="px-2.5 py-0.5 rounded text-[10px] font-mono font-bold bg-white/10 text-neutral-300 transition">1080p</button>
                </div>
            </div>
        </div>

        <!-- Main Action Buttons Row -->
        <div class="flex items-center justify-between px-2">
            <!-- Reset / Stream Live Button -->
            <button id="btnReset" class="w-12 h-12 rounded-full bg-neutral-900/80 backdrop-blur-md border border-white/10 flex items-center justify-center text-neutral-300 hover:bg-neutral-800 active:scale-95 transition shadow-lg" title="Volver a Stream en vivo">
                <i class="fa-solid fa-video text-base"></i>
            </button>

            <!-- Shutter Button (Big Round Capture Button) -->
            <button id="btnCapture" class="relative w-18 h-18 rounded-full border-4 border-white/90 bg-black/20 backdrop-blur-sm flex items-center justify-center p-1 shadow-2xl active:scale-95 transition">
                <div id="shutterInner" class="w-full h-full bg-amber-500 rounded-full transition-all duration-200 flex items-center justify-center shadow-inner">
                    <i class="fa-solid fa-bolt text-white text-xl"></i>
                </div>
            </button>

            <!-- Download Button -->
            <button id="btnDownload" disabled class="w-12 h-12 rounded-full bg-neutral-900/80 backdrop-blur-md border border-white/10 flex items-center justify-center text-neutral-500 hover:bg-neutral-800 active:scale-95 transition shadow-lg opacity-40 cursor-not-allowed" title="Guardar Foto">
                <i class="fa-solid fa-download text-base"></i>
            </button>
        </div>
    </footer>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        const frameSlider = document.getElementById('frameSlider');
        const frameCountValue = document.getElementById('frameCountValue');
        const opacitySlider = document.getElementById('opacitySlider');
        const opacityValue = document.getElementById('opacityValue');
        const btnRes720 = document.getElementById('btnRes720');
        const btnRes1080 = document.getElementById('btnRes1080');

        const btnCapture = document.getElementById('btnCapture');
        const shutterInner = document.getElementById('shutterInner');
        const btnReset = document.getElementById('btnReset');
        const btnDownload = document.getElementById('btnDownload');
        const btnSwitchCamera = document.getElementById('btnSwitchCamera');
        const btnFullscreen = document.getElementById('btnFullscreen');
        const btnBlendMode = document.getElementById('btnBlendMode');
        const blendModeLabel = document.getElementById('blendModeLabel');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');
        const configPanel = document.getElementById('configPanel');

        let currentFacingMode = 'environment';
        let currentStream = null;
        let isCapturing = false;
        let isLivePreview = true;
        
        // Modos de mezcla disponibles rotativos: 'lighter', 'screen', 'source-over' (Ghost)
        let blendModes = [
            { name: 'Lighter', mode: 'lighter', class: 'text-amber-400 font-bold' },
            { name: 'Screen', mode: 'screen', class: 'text-cyan-400 font-bold' },
            { name: 'Ghost', mode: 'source-over', class: 'text-emerald-400 font-bold' }
        ];
        let currentBlendIndex = 0;

        // Actualizar etiqueta del slider de frames
        frameSlider.addEventListener('input', (e) => {
            frameCountValue.textContent = `${e.target.value} frames`;
        });

        // Actualizar etiqueta del slider de opacidad
        opacitySlider.addEventListener('input', (e) => {
            opacityValue.textContent = `${e.target.value}%`;
        });

        // Selector de Resolución
        btnRes720.addEventListener('click', () => {
            if (isCapturing) return;
            targetResolution = { width: 1280, height: 720 };
            btnRes720.className = "px-2.5 py-0.5 rounded text-[10px] font-mono font-bold bg-amber-500 text-black transition";
            btnRes1080.className = "px-2.5 py-0.5 rounded text-[10px] font-mono font-bold bg-white/10 text-neutral-300 transition";
            initCamera();
        });

        btnRes1080.addEventListener('click', () => {
            if (isCapturing) return;
            targetResolution = { width: 1920, height: 1080 };
            btnRes1080.className = "px-2.5 py-0.5 rounded text-[10px] font-mono font-bold bg-amber-500 text-black transition";
            btnRes720.className = "px-2.5 py-0.5 rounded text-[10px] font-mono font-bold bg-white/10 text-neutral-300 transition";
            initCamera();
        });
        
        let targetResolution = { width: 1280, height: 720 };

        // Rotar entre los modos de mezcla al hacer clic
        btnBlendMode.addEventListener('click', () => {
            currentBlendIndex = (currentBlendIndex + 1) % blendModes.length;
            const current = blendModes[currentBlendIndex];
            blendModeLabel.textContent = current.name;
            blendModeLabel.className = current.class;
        });

        // Lógica de Pantalla Completa
        btnFullscreen.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.warn("Error al intentar entrar en pantalla completa:", err);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });

        document.addEventListener('fullscreenchange', () => {
            const icon = btnFullscreen.querySelector('i');
            if (document.fullscreenElement) {
                icon.className = "fa-solid fa-compress text-xs";
            } else {
                icon.className = "fa-solid fa-expand text-xs";
            }
        });

        // Inicializar cámara con la resolución elegida
        async function initCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            try {
                const constraints = {
                    video: {
                        facingMode: { ideal: currentFacingMode },
                        width: { ideal: targetResolution.width },
                        height: { ideal: targetResolution.height },
                        frameRate: { ideal: 60, min: 30 }
                    },
                    audio: false
                };

                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;

                await new Promise((resolve) => {
                    video.onloadedmetadata = () => resolve();
                });

                canvas.width = video.videoWidth || targetResolution.width;
                canvas.height = video.videoHeight || targetResolution.height;

                startLiveStream();

            } catch (err) {
                console.error("Error al acceder a la cámara:", err);
                statusText.textContent = "ERROR CÁMARA";
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-red-500";
            }
        }

        // Bucle de previsualización en vivo
        function startLiveStream() {
            isLivePreview = true;
            isCapturing = false;

            statusText.textContent = "VIVO";
            statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";

            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 1.0;
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            function renderLiveFrame(now, metadata) {
                if (!isLivePreview) return;

                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1.0;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                if ('requestVideoFrameCallback' in video) {
                    video.requestVideoFrameCallback(renderLiveFrame);
                } else {
                    requestAnimationFrame((t) => renderLiveFrame(t, null));
                }
            }

            if ('requestVideoFrameCallback' in video) {
                video.requestVideoFrameCallback(renderLiveFrame);
            } else {
                requestAnimationFrame((t) => renderLiveFrame(t, null));
            }
        }

        // Cambiar entre cámara frontal y trasera
        btnSwitchCamera.addEventListener('click', () => {
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            initCamera();
        });

        // Iniciar captura por lotes con opacidad y modo de mezcla seleccionados
        btnCapture.addEventListener('click', () => {
            if (isCapturing) return;

            isLivePreview = false;
            isCapturing = true;

            configPanel.style.opacity = '0.3';
            configPanel.style.pointerEvents = 'none';
            btnSwitchCamera.style.opacity = '0.3';
            btnSwitchCamera.style.pointerEvents = 'none';
            btnFullscreen.style.opacity = '0.3';
            btnFullscreen.style.pointerEvents = 'none';
            btnDownload.disabled = true;
            btnDownload.classList.add('opacity-40', 'cursor-not-allowed');

            const targetFrames = parseInt(frameSlider.value);
            const frameAlpha = parseInt(opacitySlider.value) / 100;
            const activeBlendMode = blendModes[currentBlendIndex].mode;
            let capturedCount = 0;

            // Limpiar canvas a negro absoluto antes de iniciar (o puedes dejar el primer frame de base)
            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 1.0;
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            statusText.textContent = `EXPONIENDO (0/${targetFrames})`;
            statusDot.className = "w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse";
            progressContainer.classList.remove('hidden');
            shutterInner.className = "w-full h-full bg-red-600 rounded-full animate-ping";

            function processCaptureFrame(now, metadata) {
                if (!isCapturing) return;

                capturedCount++;

                // Aplicar el modo de fusión elegido (Lighter, Screen o Ghost/source-over) con su opacidad
                ctx.globalCompositeOperation = activeBlendMode;
                ctx.globalAlpha = frameAlpha; 
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const percent = Math.round((capturedCount / targetFrames) * 100);
                progressBar.style.width = `${percent}%`;
                progressPercent.textContent = `${percent}%`;
                statusText.textContent = `EXPONIENDO (${capturedCount}/${targetFrames})`;

                if (capturedCount >= targetFrames) {
                    finalizarCaptura();
                } else {
                    if ('requestVideoFrameCallback' in video) {
                        video.requestVideoFrameCallback(processCaptureFrame);
                    } else {
                        setTimeout(() => {
                            if (isCapturing) requestAnimationFrame((t) => processCaptureFrame(t, null));
                        }, 16);
                    }
                }
            }

            if ('requestVideoFrameCallback' in video) {
                video.requestVideoFrameCallback(processCaptureFrame);
            } else {
                requestAnimationFrame((t) => processCaptureFrame(t, null));
            }
        });

        function finalizarCaptura() {
            isCapturing = false;
            shutterInner.className = "w-full h-full bg-amber-500 rounded-full flex items-center justify-center shadow-inner";
            progressContainer.classList.add('hidden');
            
            statusText.textContent = "¡FOTO LISTA!";
            statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500";

            configPanel.style.opacity = '1';
            configPanel.style.pointerEvents = 'auto';
            btnSwitchCamera.style.opacity = '1';
            btnSwitchCamera.style.pointerEvents = 'auto';
            btnFullscreen.style.opacity = '1';
            btnFullscreen.style.pointerEvents = 'auto';

            btnDownload.disabled = false;
            btnDownload.classList.remove('opacity-40', 'cursor-not-allowed');
            btnDownload.classList.add('text-white', 'bg-amber-600', 'hover:bg-amber-500');
        }

        // Botón Reset / Volver al Stream en vivo
        btnReset.addEventListener('click', () => {
            isCapturing = false;
            progressContainer.classList.add('hidden');
            shutterInner.className = "w-full h-full bg-amber-500 rounded-full flex items-center justify-center shadow-inner";
            
            configPanel.style.opacity = '1';
            configPanel.style.pointerEvents = 'auto';
            btnSwitchCamera.style.opacity = '1';
            btnSwitchCamera.style.pointerEvents = 'auto';
            btnFullscreen.style.opacity = '1';
            btnFullscreen.style.pointerEvents = 'auto';

            btnDownload.disabled = true;
            btnDownload.classList.add('opacity-40', 'cursor-not-allowed');
            btnDownload.classList.remove('text-white', 'bg-amber-600', 'hover:bg-amber-500');

            startLiveStream();
        });

        // Botón de Descarga
        btnDownload.addEventListener('click', () => {
            if (isCapturing || btnDownload.disabled) return;
            
            const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
            const link = document.createElement('a');
            link.download = `LightTrail_${Date.now()}.jpg`;
            link.href = dataUrl;
            link.click();
        });

        // Manejar giro de pantalla para actualizar proporciones en vivo
        window.addEventListener('resize', () => {
            if (video.videoWidth && video.videoHeight && isLivePreview) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            }
        });

        // Iniciar al cargar la ventana
        window.addEventListener('load', () => {
            initCamera();
        });
    </script>
</body>
</html>
