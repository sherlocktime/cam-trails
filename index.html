<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Re-Trazado GPU</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #000; color: #fff; user-select: none; touch-action: manipulation; }
        input[type=range] { -webkit-appearance: none; background: rgba(255, 255, 255, 0.2); height: 4px; border-radius: 2px; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%;
            background: #f59e0b; cursor: pointer; box-shadow: 0 0 10px rgba(245, 158, 11, 0.6);
        }
    </style>
</head>
<body class="h-[100dvh] w-screen flex flex-col overflow-hidden relative m-0 p-0">

    <main class="absolute inset-0 w-full h-full bg-neutral-950 flex items-center justify-center overflow-hidden z-0">
        <video id="video" autoplay playsinline muted class="hidden"></video>
        <canvas id="glCanvas" class="w-full h-full object-cover"></canvas>
    </main>

    <header class="absolute top-0 left-0 right-0 px-4 pt-3 pb-2 flex justify-between items-center z-20">
        <div class="bg-black/50 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/10 text-xs font-mono tracking-wide flex items-center space-x-2 shadow-lg">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse" id="statusDot"></span>
            <span id="statusText" class="font-semibold text-neutral-200">VIVO</span>
        </div>

        <div class="flex items-center space-x-2">
            <button id="btnShaderMode" class="w-36 bg-black/50 backdrop-blur-md border border-white/10 px-3 py-1.5 rounded-full text-xs font-mono font-semibold shadow-lg active:scale-95 transition">
                <span id="shaderLabel" class="text-amber-400 font-bold">1 ESTELAS LUZ</span>
            </button>
            <button id="btnSwitchCamera" class="w-9 h-9 rounded-full bg-black/50 backdrop-blur-md border border-white/10 flex items-center justify-center text-white active:scale-95 transition shadow-lg">
                <i class="fa-solid fa-camera-rotate text-xs"></i>
            </button>
        </div>
    </header>

    <footer class="absolute bottom-0 left-0 right-0 px-4 pb-4 pt-2 z-20 flex flex-col landscape:flex-row landscape:justify-between landscape:items-end space-y-3 landscape:space-y-0">
        <div id="controlsContainer" class="flex flex-col space-y-2 w-full landscape:w-72 bg-black/50 backdrop-blur-md px-3.5 py-2.5 rounded-xl border border-white/10 shadow-xl transition-all">
            
            <div id="progressContainer" class="hidden flex flex-col space-y-1 w-full pb-1 mb-1 border-b border-white/10">
                <div class="flex justify-between text-[11px] font-mono text-amber-400">
                    <span id="progressLabel">Procesando GPU...</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="w-full bg-white/20 h-1.5 rounded-full overflow-hidden">
                    <div id="progressBar" class="bg-amber-500 h-full w-0 transition-all duration-75"></div>
                </div>
            </div>

            <div class="flex flex-col space-y-0.5">
                <div class="flex justify-between text-[11px] text-neutral-300 font-medium">
                    <span>Frames a acumular</span>
                    <span id="frameCountVal" class="text-amber-400 font-bold font-mono">30 frames</span>
                </div>
                <input type="range" id="frameSlider" min="5" max="150" value="30" class="w-full">
            </div>

            <div class="flex flex-col space-y-0.5 pt-1">
                <div class="flex justify-between text-[11px] text-neutral-300 font-medium">
                    <span>Desvanecimiento / Opacidad</span>
                    <span id="decayVal" class="text-amber-400 font-bold font-mono">0.95</span>
                </div>
                <input type="range" id="decaySlider" min="70" max="99" value="95" class="w-full">
            </div>
        </div>

        <div class="flex items-center justify-between landscape:justify-end landscape:space-x-4 px-2">
            <button id="btnReset" class="w-12 h-12 rounded-full bg-neutral-900/80 backdrop-blur-md border border-white/10 flex items-center justify-center text-red-500 active:scale-95 transition shadow-lg" title="Cancelar / Volver a en vivo">
                <i class="fa-solid fa-rotate-right text-lg"></i>
            </button>
            <button id="btnCapture" class="relative w-20 h-20 rounded-full border-4 border-white/90 bg-black/20 backdrop-blur-sm flex items-center justify-center p-1 shadow-2xl active:scale-95 transition">
                <div id="shutterInner" class="w-full h-full bg-amber-500 rounded-full flex items-center justify-center shadow-inner">
                    <i id="shutterIcon" class="fa-solid fa-camera text-white text-xl"></i>
                </div>
            </button>
            <button id="btnDownload" disabled class="w-12 h-12 rounded-full bg-neutral-900/80 backdrop-blur-md border border-white/10 flex items-center justify-center text-neutral-500 active:scale-95 transition shadow-lg opacity-40 cursor-not-allowed" title="Guardar Foto">
                <i id="downloadIcon" class="fa-solid fa-arrow-down text-base"></i>
            </button>
        </div>
    </footer>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('glCanvas');
        const gl = canvas.getContext('webgl', { preserveDrawingBuffer: true });

        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const shutterInner = document.getElementById('shutterInner');
        const shutterIcon = document.getElementById('shutterIcon');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');
        const btnDownload = document.getElementById('btnDownload');
        const downloadIcon = document.getElementById('downloadIcon');
        const controlsContainer = document.getElementById('controlsContainer');

        let currentFacingMode = 'environment';
        let currentStream = null;
        let activeShaderIndex = 0;
        let decayValue = 0.95;
        let targetFrames = 30;
        let capturedFrames = 0;
        
        let isCapturing = false;
        let isComplete = false;

        const vsSource = `
            attribute vec2 a_position;
            varying vec2 v_texCoord;
            uniform float u_flipY;
            void main() {
                v_texCoord = vec2((a_position.x + 1.0) / 2.0, (u_flipY * a_position.y + 1.0) / 2.0);
                gl_Position = vec4(a_position, 0.0, 1.0);
            }
        `;

        const fsPassthrough = `
            precision mediump float;
            uniform sampler2D u_currentFrame;
            varying vec2 v_texCoord;
            void main() {
                gl_FragColor = texture2D(u_currentFrame, v_texCoord);
            }
        `;

        // Shader 1: Light Trails (Brillos máximos)
        const fsLight = `
            precision mediump float;
            uniform sampler2D u_currentFrame;
            uniform sampler2D u_accumulatedFrame;
            uniform float u_decay;
            varying vec2 v_texCoord;
            void main() {
                vec4 current = texture2D(u_currentFrame, v_texCoord);
                vec4 accum = texture2D(u_accumulatedFrame, v_texCoord) * u_decay;
                float lumaC = dot(current.rgb, vec3(0.299, 0.587, 0.114));
                float lumaA = dot(accum.rgb, vec3(0.299, 0.587, 0.114));
                gl_FragColor = (lumaC > lumaA) ? current : accum;
            }
        `;

        // Shader 2: GHOSTING / FANTASMA (Mezcla alfa / opacidad acumulativa)
        const fsGhost = `
            precision mediump float;
            uniform sampler2D u_currentFrame;
            uniform sampler2D u_accumulatedFrame;
            uniform float u_decay;
            varying vec2 v_texCoord;
            void main() {
                vec4 current = texture2D(u_currentFrame, v_texCoord);
                vec4 accum = texture2D(u_accumulatedFrame, v_texCoord);
                // Aplica desvanecimiento a los fotogramas anteriores y mezcla el fotograma actual
                gl_FragColor = mix(accum * u_decay, current, 1.0 - u_decay);
            }
        `;

        // Shader 3: Shadow Accumulation (Mínimos / Sombras)
        const fsShadow = `
            precision mediump float;
            uniform sampler2D u_currentFrame;
            uniform sampler2D u_accumulatedFrame;
            uniform float u_decay;
            varying vec2 v_texCoord;
            void main() {
                vec4 current = texture2D(u_currentFrame, v_texCoord);
                vec4 accum = texture2D(u_accumulatedFrame, v_texCoord);
                float lumaC = dot(current.rgb, vec3(0.299, 0.587, 0.114));
                float lumaA = dot(accum.rgb, vec3(0.299, 0.587, 0.114));
                gl_FragColor = (lumaC < lumaA) ? current : accum;
            }
        `;

        const shaders = [
            { name: '1 ESTELAS LUZ', fs: fsLight, class: 'text-amber-400 font-bold' },
            { name: '2 EFECTO FANTASMA', fs: fsGhost, class: 'text-emerald-400 font-bold' },
            { name: '3 SOMBRAS', fs: fsShadow, class: 'text-rose-400 font-bold' }
        ];

        let progPassthrough = null;
        let progProcess = null;

        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            return shader;
        }

        function initProgram(fsSource) {
            const vs = createShader(gl, gl.VERTEX_SHADER, vsSource);
            const fs = createShader(gl, gl.FRAGMENT_SHADER, fsSource);
            const prog = gl.createProgram();
            gl.attachShader(prog, vs);
            gl.attachShader(prog, fs);
            gl.linkProgram(prog);
            return prog;
        }

        let textures = [], framebuffers = [];
        let count = 0;

        function initFramebuffers(w, h) {
            textures = []; framebuffers = [];
            for (let i = 0; i < 2; i++) {
                const tex = gl.createTexture();
                gl.bindTexture(gl.TEXTURE_2D, tex);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

                const fb = gl.createFramebuffer();
                gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
                gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);

                textures.push(tex);
                framebuffers.push(fb);
            }
            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        }

        let videoTexture = null;
        function initVideoTexture() {
            videoTexture = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, videoTexture);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        }

        async function initCamera() {
            if (currentStream) currentStream.getTracks().forEach(t => t.stop());
            currentStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { ideal: currentFacingMode }, width: { ideal: 1280 }, height: { ideal: 720 } }
            });
            video.srcObject = currentStream;
            await video.play();

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            gl.viewport(0, 0, canvas.width, canvas.height);

            initFramebuffers(canvas.width, canvas.height);
            initVideoTexture();

            progPassthrough = initProgram(fsPassthrough);
            progProcess = initProgram(shaders[activeShaderIndex].fs);

            const positionBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

            resetCaptureState();
            render();
        }

        function resetCaptureState() {
            isCapturing = false;
            isComplete = false;
            capturedFrames = 0;
            count = 0;

            statusText.textContent = "VIVO";
            statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
            progressContainer.classList.add('hidden');
            shutterInner.className = "w-full h-full bg-amber-500 rounded-full flex items-center justify-center shadow-inner";
            shutterIcon.className = "fa-solid fa-camera text-white text-xl";

            controlsContainer.style.opacity = '1';
            controlsContainer.style.pointerEvents = 'auto';

            btnDownload.disabled = true;
            btnDownload.classList.add('opacity-40', 'cursor-not-allowed', 'text-neutral-500');
            btnDownload.classList.remove('text-amber-400');
            downloadIcon.className = "fa-solid fa-arrow-down text-base";
        }

        function render() {
            if (!video.paused && video.readyState >= 2) {
                gl.bindTexture(gl.TEXTURE_2D, videoTexture);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);

                const posLoc = 0;

                if (!isCapturing && !isComplete) {
                    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
                    gl.useProgram(progPassthrough);
                    gl.uniform1f(gl.getUniformLocation(progPassthrough, "u_flipY"), -1.0);

                    gl.activeTexture(gl.TEXTURE0);
                    gl.bindTexture(gl.TEXTURE_2D, videoTexture);
                    gl.uniform1i(gl.getUniformLocation(progPassthrough, "u_currentFrame"), 0);

                    gl.enableVertexAttribArray(posLoc);
                    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

                } else if (isCapturing) {
                    capturedFrames++;
                    const readIdx = count % 2;
                    const writeIdx = (count + 1) % 2;

                    gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffers[writeIdx]);
                    gl.useProgram(progProcess);

                    if (capturedFrames === 1) {
                        gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffers[readIdx]);
                        gl.useProgram(progPassthrough);
                        gl.uniform1f(gl.getUniformLocation(progPassthrough, "u_flipY"), -1.0);
                        gl.activeTexture(gl.TEXTURE0);
                        gl.bindTexture(gl.TEXTURE_2D, videoTexture);
                        gl.uniform1i(gl.getUniformLocation(progPassthrough, "u_currentFrame"), 0);
                        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

                        gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffers[writeIdx]);
                        gl.useProgram(progProcess);
                    }

                    gl.uniform1f(gl.getUniformLocation(progProcess, "u_flipY"), -1.0);

                    gl.activeTexture(gl.TEXTURE0);
                    gl.bindTexture(gl.TEXTURE_2D, videoTexture);
                    gl.uniform1i(gl.getUniformLocation(progProcess, "u_currentFrame"), 0);

                    gl.activeTexture(gl.TEXTURE1);
                    gl.bindTexture(gl.TEXTURE_2D, textures[readIdx]);
                    gl.uniform1i(gl.getUniformLocation(progProcess, "u_accumulatedFrame"), 1);

                    gl.uniform1f(gl.getUniformLocation(progProcess, "u_decay"), decayValue);

                    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

                    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
                    gl.useProgram(progPassthrough);
                    gl.uniform1f(gl.getUniformLocation(progPassthrough, "u_flipY"), 1.0);
                    gl.activeTexture(gl.TEXTURE0);
                    gl.bindTexture(gl.TEXTURE_2D, textures[writeIdx]);
                    gl.uniform1i(gl.getUniformLocation(progPassthrough, "u_currentFrame"), 0);
                    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

                    const percent = Math.round((capturedFrames / targetFrames) * 100);
                    progressBar.style.width = `${percent}%`;
                    progressPercent.textContent = `${percent}%`;
                    statusText.textContent = `(${capturedFrames}/${targetFrames})`;

                    count++;

                    if (capturedFrames >= targetFrames) {
                        finishCapture();
                    }
                }
            }
            requestAnimationFrame(render);
        }

        function finishCapture() {
            isCapturing = false;
            isComplete = true;

            statusText.textContent = "LISTO";
            statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500";
            shutterInner.className = "w-full h-full bg-amber-500 rounded-full flex items-center justify-center shadow-inner";
            progressContainer.classList.add('hidden');

            controlsContainer.style.opacity = '1';
            controlsContainer.style.pointerEvents = 'auto';

            btnDownload.disabled = false;
            btnDownload.classList.remove('opacity-40', 'cursor-not-allowed', 'text-neutral-500');
            btnDownload.classList.add('text-amber-400');
        }

        document.getElementById('frameSlider').addEventListener('input', (e) => {
            targetFrames = parseInt(e.target.value);
            document.getElementById('frameCountVal').textContent = `${targetFrames} frames`;
        });

        document.getElementById('decaySlider').addEventListener('input', (e) => {
            decayValue = parseFloat(e.target.value) / 100;
            document.getElementById('decayVal').textContent = decayValue.toFixed(2);
        });

        document.getElementById('btnShaderMode').addEventListener('click', () => {
            if (isCapturing) return;
            activeShaderIndex = (activeShaderIndex + 1) % shaders.length;
            const s = shaders[activeShaderIndex];
            document.getElementById('shaderLabel').textContent = s.name;
            document.getElementById('shaderLabel').className = s.class;
            progProcess = initProgram(s.fs);
        });

        document.getElementById('btnCapture').addEventListener('click', () => {
            if (isCapturing) return;

            isCapturing = true;
            isComplete = false;
            capturedFrames = 0;

            statusText.textContent = `(0/${targetFrames})`;
            statusDot.className = "w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse";
            progressContainer.classList.remove('hidden');

            shutterInner.className = "w-full h-full bg-red-600 rounded-full animate-pulse shadow-lg flex items-center justify-center";
            
            controlsContainer.style.opacity = '0.4';
            controlsContainer.style.pointerEvents = 'none';
        });

        document.getElementById('btnReset').addEventListener('click', () => {
            initFramebuffers(canvas.width, canvas.height);
            resetCaptureState();
        });

        document.getElementById('btnSwitchCamera').addEventListener('click', () => {
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            initCamera();
        });

        document.getElementById('btnDownload').addEventListener('click', () => {
            if (!isComplete) return;
            const link = document.createElement('a');
            link.download = `fantasma_gpu_${Date.now()}.jpg`;
            link.href = canvas.toDataURL('image/jpeg', 0.95);
            link.click();

            downloadIcon.className = "fa-solid fa-check text-base text-emerald-400";
            setTimeout(() => { downloadIcon.className = "fa-solid fa-arrow-down text-base text-amber-400"; }, 1500);
        });

        window.addEventListener('load', initCamera);
    </script>
</body>
</html>
