<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Re-Trazado WebGL</title>

    <!-- Vinculación del Web App Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#eeeeee">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-color: #000;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        input[type=range] {
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.25);
            height: 4px;
            border-radius: 2px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #f59e0b;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.6);
        }
        /* Ancho fijo para el botón de modos */
        .btn-mode-fixed {
            width: 125px;
            min-width: 125px;
            max-width: 125px;
        }
    </style>
</head>
<body class="h-[100dvh] w-screen flex flex-col overflow-hidden relative m-0 p-0">

    <main class="absolute inset-0 w-full h-full bg-neutral-950 flex items-center justify-center overflow-hidden z-0">
        <video id="video" autoplay playsinline muted class="hidden"></video>
        <canvas id="glCanvas" class="w-full h-full object-cover"></canvas>
    </main>

    <header class="absolute top-0 left-0 right-0 px-4 pt-3 pb-2 flex justify-between items-center z-20 pointer-events-auto">
        <div class="bg-black/50 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/10 text-xs font-mono tracking-wide flex items-center space-x-2 shadow-lg">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse" id="statusDot"></span>
            <span id="statusText" class="font-semibold text-neutral-200">VIVO</span>
        </div>

        <div class="flex items-center space-x-2">
            <!-- Botón de modos con ancho fijo -->
            <button id="btnShaderMode" class="btn-mode-fixed bg-black/50 backdrop-blur-md border border-white/10 px-2 py-1.5 rounded-full text-xs font-mono font-semibold shadow-lg active:scale-95 transition flex items-center justify-center overflow-hidden whitespace-nowrap">
                <span id="shaderLabel" class="text-cyan-400 font-bold truncate">1 PROMEDIO</span>
            </button>

            <!-- Botón para alternar Resolución 720p / 1080p -->
            <button id="btnRes" class="px-2.5 py-1.5 rounded-full bg-black/50 backdrop-blur-md border border-white/10 text-xs font-mono font-bold text-amber-400 active:scale-95 transition shadow-lg" title="Cambiar Resolución">
                720p
            </button>

            <button id="btnFullscreen" class="w-9 h-9 rounded-full bg-black/50 backdrop-blur-md border border-white/10 flex items-center justify-center text-white active:scale-95 transition shadow-lg" title="Pantalla Completa">
                <i class="fa-solid fa-expand text-xs"></i>
            </button>
            <button id="btnSwitchCamera" class="w-9 h-9 rounded-full bg-black/50 backdrop-blur-md border border-white/10 flex items-center justify-center text-white active:scale-95 transition shadow-lg" title="Cambiar Cámara">
                <i class="fa-solid fa-camera-rotate text-xs"></i>
            </button>
        </div>
    </header>

    <footer class="absolute bottom-0 left-0 right-0 px-4 pb-4 pt-2 landscape:pb-3 landscape:px-6 backdrop-blur-[1px] z-20 flex flex-col landscape:flex-row landscape:justify-between landscape:items-end space-y-3 landscape:space-y-0">

        <div class="flex flex-col space-y-2 w-full landscape:w-72">
            <div id="progressContainer" class="hidden flex flex-col space-y-1 w-full bg-black/60 backdrop-blur-md p-2.5 rounded-xl border border-white/10">
                <div class="flex justify-between text-[11px] font-mono text-amber-400">
                    <span id="progressLabel">Procesando frames (GPU)...</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="w-full bg-white/20 h-1.5 rounded-full overflow-hidden">
                    <div id="progressBar" class="bg-amber-500 h-full w-0 transition-all duration-75"></div>
                </div>
            </div>

            <div id="configPanel" class="flex flex-col space-y-2 bg-black/50 backdrop-blur-md px-3.5 py-2.5 rounded-xl border border-white/10 shadow-xl">
                <div class="flex flex-col space-y-0.5">
                    <div class="flex justify-between text-[11px] text-neutral-300 font-medium">
                        <span>Frames a acumular</span>
                        <span id="frameCountValue" class="text-amber-400 font-bold font-mono">25 frames</span>
                    </div>
                    <input type="range" id="frameSlider" min="5" max="150" value="25" class="w-full">
                </div>

                <div class="flex flex-col space-y-0.5">
                    <div class="flex justify-between text-[11px] text-neutral-300 font-medium">
                        <span>Desvanecimiento (Decay)</span>
                        <span id="decayValue" class="text-amber-400 font-bold font-mono">100%</span>
                    </div>
                    <input type="range" id="decaySlider" min="80" max="100" value="100" class="w-full">
                </div>
            </div>
        </div>

        <div class="flex items-center justify-between landscape:justify-end landscape:space-x-4 px-2 landscape:px-0">
            <button id="btnReset" class="w-12 h-12 rounded-full bg-neutral-900/80 backdrop-blur-md border border-white/10 flex items-center justify-center text-red-500 hover:bg-neutral-800 active:scale-95 transition shadow-lg" title="Volver a Stream en vivo">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>

            <button id="btnCapture" class="relative w-20 h-20 landscape:w-20 landscape:h-20 rounded-full border-4 border-white/90 bg-black/20 backdrop-blur-sm flex items-center justify-center p-1 shadow-2xl active:scale-95 transition flex-shrink-0">
                <div id="shutterInner" class="w-full h-full bg-amber-500 rounded-full transition-all duration-200 flex items-center justify-center shadow-inner">
                    <i id="shutterIcon" class="fa-solid fa-bolt text-white text-xl leading-none transition-opacity duration-200"></i>
                </div>
            </button>

            <button id="btnDownload" disabled class="w-12 h-12 rounded-full bg-neutral-900/80 backdrop-blur-md border border-white/10 flex items-center justify-center text-neutral-500 hover:bg-neutral-800 active:scale-95 transition shadow-lg opacity-40 cursor-not-allowed" title="Guardar Foto">
                <i id="downloadIcon" class="fa-solid fa-arrow-down text-base"></i>
            </button>
        </div>
    </footer>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('glCanvas');
        const gl = canvas.getContext('webgl', { preserveDrawingBuffer: true });

        const frameSlider = document.getElementById('frameSlider');
        const frameCountValue = document.getElementById('frameCountValue');
        const decaySlider = document.getElementById('decaySlider');
        const decayValue = document.getElementById('decayValue');

        const btnCapture = document.getElementById('btnCapture');
        const shutterInner = document.getElementById('shutterInner');
        const shutterIcon = document.getElementById('shutterIcon');
        const btnReset = document.getElementById('btnReset');
        const btnDownload = document.getElementById('btnDownload');
        const downloadIcon = document.getElementById('downloadIcon');
        const btnSwitchCamera = document.getElementById('btnSwitchCamera');
        const btnFullscreen = document.getElementById('btnFullscreen');
        const btnShaderMode = document.getElementById('btnShaderMode');
        const shaderLabel = document.getElementById('shaderLabel');
        const btnRes = document.getElementById('btnRes');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');
        const configPanel = document.getElementById('configPanel');

        let currentFacingMode = 'environment';
        let currentResMode = '720p'; // '720p' o '1080p'
        let currentStream = null;
        let isCapturing = false;
        let isLivePreview = true;
        let capturedFramesCount = 0;
        let targetFrames = 25;
        let decayVal = 1.0;

        // --- SHADERS WEBGL ---

        // Inclusión de u_flipX para espejar en modo frontal (selfie)
        const vsSource = `
            attribute vec2 a_position;
            varying vec2 v_texCoord;
            uniform float u_flipY;
            uniform float u_flipX;
            void main() {
                v_texCoord = vec2((a_position.x + 1.0) / 2.0, (a_position.y + 1.0) / 2.0);
                if (u_flipY > 0.5) {
                    v_texCoord.y = 1.0 - v_texCoord.y;
                }
                if (u_flipX > 0.5) {
                    v_texCoord.x = 1.0 - v_texCoord.x;
                }
                gl_Position = vec4(a_position, 0.0, 1.0);
            }
        `;

        const fsPassthrough = `
            precision mediump float;
            uniform sampler2D u_currentFrame;
            varying vec2 v_texCoord;
            void main() {
                gl_FragColor = texture2D(u_currentFrame, v_texCoord);
            }
        `;

        // Shader: Promedio
        const fsAverage = `
            precision mediump float;
            uniform sampler2D u_currentFrame;
            uniform sampler2D u_accumulatedFrame;
            uniform float u_decay;
            varying vec2 v_texCoord;
            void main() {
                vec4 current = texture2D(u_currentFrame, v_texCoord);
                vec4 accum = texture2D(u_accumulatedFrame, v_texCoord) * u_decay;
                gl_FragColor = mix(accum, current, 0.12);
            }
        `;

        // Shader: Estelas
        const fsLight = `
            precision mediump float;
            uniform sampler2D u_currentFrame;
            uniform sampler2D u_accumulatedFrame;
            uniform float u_decay;
            varying vec2 v_texCoord;
            void main() {
                vec4 current = texture2D(u_currentFrame, v_texCoord);
                vec4 accum = texture2D(u_accumulatedFrame, v_texCoord) * u_decay;
                float lumaC = dot(current.rgb, vec3(0.299, 0.587, 0.114));
                float lumaA = dot(accum.rgb, vec3(0.299, 0.587, 0.114));
                gl_FragColor = (lumaC > lumaA) ? current : accum;
            }
        `;

        // Shader: Sombras
        const fsShadow = `
            precision mediump float;
            uniform sampler2D u_currentFrame;
            uniform sampler2D u_accumulatedFrame;
            uniform float u_decay;
            varying vec2 v_texCoord;
            void main() {
                vec4 current = texture2D(u_currentFrame, v_texCoord);
                vec4 accum = texture2D(u_accumulatedFrame, v_texCoord);
                float lumaC = dot(current.rgb, vec3(0.299, 0.587, 0.114));
                float lumaA = dot(accum.rgb, vec3(0.299, 0.587, 0.114));
                gl_FragColor = (lumaC < lumaA) ? current : accum;
            }
        `;

        // Shader: Contorno
        const fsMotion = `
            precision mediump float;
            uniform sampler2D u_currentFrame;
            uniform sampler2D u_accumulatedFrame;
            uniform float u_decay;
            varying vec2 v_texCoord;

            void main() {
                vec4 current = texture2D(u_currentFrame, v_texCoord);
                vec4 accum = texture2D(u_accumulatedFrame, v_texCoord);

                vec3 diff = abs(current.rgb - accum.rgb);
                float motion = dot(diff, vec3(0.333));

                if (motion > 0.15) {
                    gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
                } else {
                    gl_FragColor = current;
                }
            }
        `;

        // Shader: Color Dodge (Sobreexposición Neón / Retro-Wave)
        const fsColorDodge = `
            precision mediump float;
            uniform sampler2D u_currentFrame;
            uniform sampler2D u_accumulatedFrame;
            uniform float u_decay;
            varying vec2 v_texCoord;

            // Función auxiliar para calcular Color Dodge canal por canal de forma segura
            float colorDodge(float base, float blend) {
                if (base >= 1.0) return 1.0;
                float denominator = 1.0 - blend;
                if (denominator <= 0.001) return 1.0; // Evita división por cero
                return min(1.0, base / denominator);
            }

            void main() {
                vec4 current = texture2D(u_currentFrame, v_texCoord);
                vec4 accum = texture2D(u_accumulatedFrame, v_texCoord) * u_decay;

                // Aplicamos el blend suavemente mezclando una fracción del dodge
                vec3 dodgeColor = vec3(
                    colorDodge(current.r, accum.r),
                    colorDodge(current.g, accum.g),
                    colorDodge(current.b, accum.b)
                );

                // Mezclamos un 05% del color Dodge con la acumulación para mantener estabilidad
                gl_FragColor = vec4(mix(accum.rgb, dodgeColor, 0.05), 1.0);
            }
        `;

        const shaderModes = [
            { name: '1.PROMEDIO', fs: fsAverage, class: 'text-cyan-400 font-bold' },
            { name: '2.ESTELAS', fs: fsLight, class: 'text-amber-400 font-bold' },
            { name: '3.SOMBRAS', fs: fsShadow, class: 'text-rose-400 font-bold' },
            { name: '4.COLOR', fs: fsColorDodge, class: 'text-purple-400 font-bold' },
            { name: '5.CONTORNO', fs: fsMotion, class: 'text-emerald-400 font-bold' }
        ];
        let currentShaderIndex = 0;

        let passProgram, blendProgram;
        let textures = [], framebuffers = [];
        let videoTexture = null;
        let pingPongCount = 0;

        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error(gl.getShaderInfoLog(shader));
                gl.deleteShader(shader);
                return null;
            }
            return shader;
        }

        function createProgram(vsSource, fsSource) {
            const vs = createShader(gl, gl.VERTEX_SHADER, vsSource);
            const fs = createShader(gl, gl.FRAGMENT_SHADER, fsSource);
            const prog = gl.createProgram();
            gl.attachShader(prog, vs);
            gl.attachShader(prog, fs);
            gl.linkProgram(prog);
            return prog;
        }

        function initGLResources(w, h) {
            passProgram = createProgram(vsSource, fsPassthrough);
            blendProgram = createProgram(vsSource, shaderModes[currentShaderIndex].fs);

            videoTexture = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, videoTexture);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

            const positionBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
                -1, -1,
                 1, -1,
                -1,  1,
                 1,  1,
            ]), gl.STATIC_DRAW);

            initFramebuffers(w, h);
        }

        function initFramebuffers(w, h) {
            textures = [];
            framebuffers = [];
            for (let i = 0; i < 2; i++) {
                const tex = gl.createTexture();
                gl.bindTexture(gl.TEXTURE_2D, tex);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

                const fb = gl.createFramebuffer();
                gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
                gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);

                textures.push(tex);
                framebuffers.push(fb);
            }
            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        }

        function renderCapturedResult() {
            if (textures.length === 0) return;
            const finalIdx = (pingPongCount) % 2;

            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
            gl.useProgram(passProgram);

            const posLocPass = gl.getAttribLocation(passProgram, "a_position");
            gl.enableVertexAttribArray(posLocPass);
            gl.vertexAttribPointer(posLocPass, 2, gl.FLOAT, false, 0, 0);

            gl.uniform1f(gl.getUniformLocation(passProgram, "u_flipY"), 1.0);
            gl.uniform1f(gl.getUniformLocation(passProgram, "u_flipX"), 0.0);

            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, textures[finalIdx]);
            gl.uniform1i(gl.getUniformLocation(passProgram, "u_currentFrame"), 0);

            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        }

        function handleResize() {
            if (!video.videoWidth || !video.videoHeight) return;

            const w = video.videoWidth;
            const h = video.videoHeight;

            if (isLivePreview) {
                if (canvas.width !== w || canvas.height !== h) {
                    canvas.width = w;
                    canvas.height = h;
                    gl.viewport(0, 0, w, h);
                    initFramebuffers(w, h);
                }
            } else if (!isCapturing) {
                gl.viewport(0, 0, canvas.width, canvas.height);
                renderCapturedResult();
            }
        }

        async function initCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            // Elección de resolución según selección
            const reqWidth = currentResMode === '1080p' ? 1920 : 1280;
            const reqHeight = currentResMode === '1080p' ? 1080 : 720;

            try {
                currentStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: currentFacingMode },
                        width: { ideal: reqWidth },
                        height: { ideal: reqHeight }
                    },
                    audio: false
                });
                video.srcObject = currentStream;
                await video.play();

                canvas.width = video.videoWidth || reqWidth;
                canvas.height = video.videoHeight || reqHeight;
                gl.viewport(0, 0, canvas.width, canvas.height);

                initGLResources(canvas.width, canvas.height);
                startLivePreview();

            } catch (err) {
                console.error("Error cámara:", err);
                statusText.textContent = "ERROR CÁMARA";
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-red-500";
            }
        }

        function startLivePreview() {
            isLivePreview = true;
            isCapturing = false;

            statusText.textContent = "VIVO";
            statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";

            function renderLive() {
                if (!isLivePreview) return;

                if (video.readyState >= 2) {
                    handleResize();

                    gl.bindTexture(gl.TEXTURE_2D, videoTexture);
                    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);

                    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
                    gl.useProgram(passProgram);

                    const posLoc = gl.getAttribLocation(passProgram, "a_position");
                    gl.enableVertexAttribArray(posLoc);
                    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

                    // Si es cámara frontal, espejamos horizontalmente (u_flipX = 1.0)
                    const isFrontCamera = currentFacingMode === 'user';
                    gl.uniform1f(gl.getUniformLocation(passProgram, "u_flipY"), 1.0);
                    gl.uniform1f(gl.getUniformLocation(passProgram, "u_flipX"), isFrontCamera ? 1.0 : 0.0);

                    gl.activeTexture(gl.TEXTURE0);
                    gl.bindTexture(gl.TEXTURE_2D, videoTexture);
                    gl.uniform1i(gl.getUniformLocation(passProgram, "u_currentFrame"), 0);

                    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                }

                requestAnimationFrame(renderLive);
            }
            requestAnimationFrame(renderLive);
        }

        btnCapture.addEventListener('click', () => {
            if (isCapturing) return;

            isLivePreview = false;
            isCapturing = true;
            capturedFramesCount = 0;
            pingPongCount = 0;

            targetFrames = parseInt(frameSlider.value);
            decayVal = parseInt(decaySlider.value) / 100;

            configPanel.style.opacity = '0.3';
            configPanel.style.pointerEvents = 'none';
            btnSwitchCamera.style.opacity = '0.3';
            btnSwitchCamera.style.pointerEvents = 'none';
            btnRes.style.opacity = '0.3';
            btnRes.style.pointerEvents = 'none';
            btnDownload.disabled = true;
            btnDownload.classList.add('opacity-40', 'cursor-not-allowed');

            statusText.textContent = `(0/${targetFrames})`;
            statusDot.className = "w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse";
            progressContainer.classList.remove('hidden');

            shutterInner.className = "w-full h-full bg-red-600 rounded-full animate-pulse shadow-lg scale-95 transition-all flex items-center justify-center";
            shutterIcon.classList.add('opacity-0');

            const isFrontCamera = currentFacingMode === 'user';

            gl.bindTexture(gl.TEXTURE_2D, videoTexture);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);

            gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffers[0]);
            gl.useProgram(passProgram);

            const posLoc = gl.getAttribLocation(passProgram, "a_position");
            gl.enableVertexAttribArray(posLoc);
            gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

            gl.uniform1f(gl.getUniformLocation(passProgram, "u_flipY"), 0.0);
            gl.uniform1f(gl.getUniformLocation(passProgram, "u_flipX"), isFrontCamera ? 1.0 : 0.0);

            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, videoTexture);
            gl.uniform1i(gl.getUniformLocation(passProgram, "u_currentFrame"), 0);

            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

            processFrame();
        });

        function processFrame() {
            if (!isCapturing) return;

            capturedFramesCount++;

            gl.bindTexture(gl.TEXTURE_2D, videoTexture);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);

            const readIdx = pingPongCount % 2;
            const writeIdx = (pingPongCount + 1) % 2;
            const isFrontCamera = currentFacingMode === 'user';

            gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffers[writeIdx]);
            gl.useProgram(blendProgram);

            const posLoc = gl.getAttribLocation(blendProgram, "a_position");
            gl.enableVertexAttribArray(posLoc);
            gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

            gl.uniform1f(gl.getUniformLocation(blendProgram, "u_flipY"), 0.0);
            gl.uniform1f(gl.getUniformLocation(blendProgram, "u_flipX"), isFrontCamera ? 1.0 : 0.0);

            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, videoTexture);
            gl.uniform1i(gl.getUniformLocation(blendProgram, "u_currentFrame"), 0);

            gl.activeTexture(gl.TEXTURE1);
            gl.bindTexture(gl.TEXTURE_2D, textures[readIdx]);
            gl.uniform1i(gl.getUniformLocation(blendProgram, "u_accumulatedFrame"), 1);

            gl.uniform1f(gl.getUniformLocation(blendProgram, "u_decay"), decayVal);

            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
            gl.useProgram(passProgram);

            const posLocPass = gl.getAttribLocation(passProgram, "a_position");
            gl.enableVertexAttribArray(posLocPass);
            gl.vertexAttribPointer(posLocPass, 2, gl.FLOAT, false, 0, 0);

            gl.uniform1f(gl.getUniformLocation(passProgram, "u_flipY"), 1.0);
            gl.uniform1f(gl.getUniformLocation(passProgram, "u_flipX"), 0.0); // Ya viene espejado de la textura acumulada
            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, textures[writeIdx]);
            gl.uniform1i(gl.getUniformLocation(passProgram, "u_currentFrame"), 0);

            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

            pingPongCount++;

            const percent = Math.round((capturedFramesCount / targetFrames) * 100);
            progressBar.style.width = `${percent}%`;
            progressPercent.textContent = `${percent}%`;
            statusText.textContent = `(${capturedFramesCount}/${targetFrames})`;

            if (capturedFramesCount >= targetFrames) {
                finalizarCaptura();
            } else {
                requestAnimationFrame(processFrame);
            }
        }

        function finalizarCaptura() {
            isCapturing = false;

            shutterInner.className = "w-full h-full bg-amber-500 rounded-full flex items-center justify-center shadow-inner transition-all";
            shutterIcon.classList.remove('opacity-0');
            progressContainer.classList.add('hidden');

            statusText.textContent = "LISTO";
            statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500";

            configPanel.style.opacity = '1';
            configPanel.style.pointerEvents = 'auto';
            btnSwitchCamera.style.opacity = '1';
            btnSwitchCamera.style.pointerEvents = 'auto';
            btnRes.style.opacity = '1';
            btnRes.style.pointerEvents = 'auto';

            btnDownload.disabled = false;
            btnDownload.classList.remove('opacity-40', 'cursor-not-allowed', 'text-neutral-500');
            btnDownload.classList.add('text-amber-400', 'hover:bg-neutral-800');
        }

        // --- EVENTOS DE INTERFAZ ---

        frameSlider.addEventListener('input', (e) => {
            frameCountValue.textContent = `${e.target.value} frames`;
        });

        decaySlider.addEventListener('input', (e) => {
            decayValue.textContent = `${e.target.value}%`;
        });

        btnShaderMode.addEventListener('click', () => {
            currentShaderIndex = (currentShaderIndex + 1) % shaderModes.length;
            const current = shaderModes[currentShaderIndex];
            shaderLabel.textContent = current.name;
            shaderLabel.className = current.class;

            blendProgram = createProgram(vsSource, current.fs);
        });

        btnRes.addEventListener('click', () => {
            if (isCapturing) return;
            currentResMode = currentResMode === '720p' ? '1080p' : '720p';
            btnRes.textContent = currentResMode;
            initCamera();
        });

        btnReset.addEventListener('click', () => {
            if (isCapturing) return;

            btnDownload.disabled = true;
            btnDownload.classList.add('opacity-40', 'cursor-not-allowed', 'text-neutral-500');
            btnDownload.classList.remove('text-amber-400', 'hover:bg-neutral-800');
            downloadIcon.className = "fa-solid fa-arrow-down text-base";

            startLivePreview();
        });

        btnSwitchCamera.addEventListener('click', () => {
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            initCamera();
        });

        btnFullscreen.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.warn(err));
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        });

        btnDownload.addEventListener('click', () => {
            if (btnDownload.disabled) return;

            const shaderName = shaderModes[currentShaderIndex].name.replace(/[^a-zA-Z0-9]/g, '_');
            const frames = frameSlider.value;
            const now = new Date();
            const pad = (n) => String(n).padStart(2, '0');
            const fechaStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}_${pad(now.getHours())}-${pad(now.getMinutes())}-${pad(now.getSeconds())}`;
            const fileName = `${shaderName}_${frames}f_${fechaStr}.jpg`;

            const link = document.createElement('a');
            link.download = fileName;
            link.href = canvas.toDataURL('image/jpeg', 0.95);
            link.click();

            downloadIcon.className = "fa-solid fa-check text-base text-emerald-400";
            btnDownload.classList.add('scale-110');
            setTimeout(() => {
                downloadIcon.className = "fa-solid fa-arrow-down text-base text-amber-400";
                btnDownload.classList.remove('scale-110');
            }, 1000);
        });

        window.addEventListener('resize', handleResize);
        window.addEventListener('load', initCamera);
    </script>
</body>
</html>
